name: Code Quality & Security

# ═══════════════════════════════════════════════════════════════════════════
# Fast, dependency-light gates that must pass on every push and PR.
#
# Deliberately NO Gradle job here: the Android build and the unit tests already
# run in android-release.yml (the `ci` job on PRs, the `release` job on main),
# where the SDK, build-tools and Gradle cache are properly provisioned. Running
# a second, under-provisioned `./gradlew` job here only duplicated ~10 minutes
# of CI per PR and failed for environmental rather than code reasons.
#
# What runs instead — all of it in seconds:
#   • Gitleaks        → secrets accidentally committed
#   • check_sql.py    → migration filenames, ordering, RLS coverage, no secrets,
#                       and a real PostgreSQL grammar parse (pglast/libpg_query)
#   • check_artifacts.py → the Supabase migration integrity checklist
# ═══════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  migrations:
    name: Supabase Migration Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pglast (PostgreSQL grammar parser)
        # Optional: tools/check_sql.py degrades to a warning if this fails, so a
        # wheel problem can never block an unrelated change.
        continue-on-error: true
        run: pip install pglast

      - name: Lint supabase/migrations
        run: python3 tools/check_sql.py

  artifacts:
    name: Supabase Integration Checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run integrity verification
        run: python3 check_artifacts.py
