name: Firebase Deploy (Firestore Rules & Indexes)

# ═══════════════════════════════════════════════════════════════════════════
# ينشر تلقائياً firestore.rules + firestore.indexes.json إلى مشروع Firebase
# الحقيقي (zmastery) في كل مرة يتغيّر أحدهما على main — بلا أي خطوة يدوية،
# وبلا أي مفتاح JSON لحساب خدمة (متوافق مع سياسة المؤسسة
# iam.disableServiceAccountKeyCreation المفعّلة افتراضياً في المؤسسات
# الحديثة على Google Cloud).
#
# ⚠️ هذا الملف "قالب" محفوظ في docs/ci-templates/ — انسخه إلى
#    .github/workflows/firebase-deploy.yml ليصبح فعّالاً (خطوة §4 في
#    docs/FIREBASE_SETUP.md):
#      mkdir -p .github/workflows
#      cp docs/ci-templates/firebase-deploy.yml.template .github/workflows/firebase-deploy.yml
#
# لماذا سير عمل منفصل عن android-release.yml؟
#   • قواعد Firestore يجب أن تُنشر فوراً عند تعديلها (أمان)، بصرف النظر عن
#     دورة بناء الأندرويد الأطول (اختبارات + Gradle + توقيع).
#   • فشل نشر القواعد يجب أن يظهر كخطأ واضح مستقل لا يغرق داخل لوق بناء ضخم.
#
# آلية المصادقة: Workload Identity Federation (WIF) — بلا مفاتيح إطلاقاً.
#   بدل تنزيل ملف JSON طويل الأمد (ممنوع بسياسة iam.disableServiceAccountKeyCreation)،
#   يبادل GitHub Actions رمز OIDC مؤقتاً صادراً عن GitHub نفسه بتوكن Google Cloud
#   صالح لدقائق فقط، عبر انتحال صفة (impersonation) حساب خدمة محدد سلفاً.
#   لا يوجد أي سرّ دائم يمكن تسريبه.
#
# الإعداد المطلوب منك (مرة واحدة فقط) — راجع القسم 4.1 من docs/FIREBASE_SETUP.md
# للأوامر الكاملة القابلة للنسخ واللصق:
#   1) أنشئ حساب خدمة (إنشاء حساب الخدمة نفسه غير ممنوع، الممنوع فقط هو تنزيل
#      مفتاح JSON له) بصلاحية "Firebase Rules Admin" + "Cloud Datastore Index Admin".
#   2) أنشئ Workload Identity Pool + Provider مربوطين بمستودع GitHub هذا تحديداً
#      (عبر gcloud iam workload-identity-pools ...).
#   3) اربط حساب الخدمة بالـ Provider عبر add-iam-policy-binding
#      (roles/iam.workloadIdentityUser) — هذه هي "الثقة" التي تسمح لهذا
#      المستودع تحديداً بانتحال صفة الحساب، بلا أي كلمة سرّ متبادلة.
#   4) أضف قيمتين فقط كأسرار GitHub (ليستا حسّاستين بنفس درجة مفتاح JSON، لأنهما
#      مجرد معرّفات موارد لا صلاحيات فعلية بذاتهما):
#        - WIF_PROVIDER  → المسار الكامل للـ Provider
#        - WIF_SERVICE_ACCOUNT → بريد حساب الخدمة
#   5) بعد نسخ هذا الملف إلى .github/workflows/، أي دفعة تعدّل firestore.rules
#      أو firestore.indexes.json إلى main تُشغّله تلقائياً — أو شغّله يدوياً
#      (Actions ← Firebase Deploy ← Run workflow).
# ═══════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "فحص القواعد فقط بلا نشر فعلي (dry-run)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # لازم لتوليد رمز OIDC المستخدم في Workload Identity Federation

jobs:
  deploy-firestore:
    name: نشر قواعد وفهارس Firestore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: تحقق من ضبط أسرار WIF
        env:
          HAS_PROVIDER: ${{ secrets.WIF_PROVIDER != '' }}
          HAS_SA: ${{ secrets.WIF_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_PROVIDER" != "true" ] || [ "$HAS_SA" != "true" ]; then
            echo "::error::السرّان WIF_PROVIDER و/أو WIF_SERVICE_ACCOUNT غير مضبوطين في إعدادات المستودع."
            echo "::error::أضفهما من: Settings → Secrets and variables → Actions → New repository secret."
            echo "::error::راجع القسم 4.1 من docs/FIREBASE_SETUP.md لخطوات إنشائهما (بلا أي مفتاح JSON)."
            exit 1
          fi

      - name: المصادقة على Google Cloud عبر Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: التحقق من صحة القواعد (dry-run دائماً كخطوة أولى)
        run: |
          firebase --version
          firebase deploy --only firestore:rules,firestore:indexes \
            --project zmastery --non-interactive --dry-run --debug

      - name: نشر القواعد والفهارس فعلياً
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          firebase deploy --only firestore:rules,firestore:indexes \
            --project zmastery --non-interactive

      - name: ملخص التشغيلة
        if: always()
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "## 🧪 فحص فقط (dry-run) — لم يُنشر شيء فعلياً" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ نُشرت قواعد وفهارس Firestore إلى مشروع zmastery (عبر Workload Identity Federation، بلا أي مفتاح JSON)" >> "$GITHUB_STEP_SUMMARY"
          fi
