# ═══════════════════════════════════════════════════════════════════
#  Z-Mastery · CI Pipeline (Debug Build + Unit Tests)
# ═══════════════════════════════════════════════════════════════════
#
#  يُشغَّل تلقائياً عند كل push أو pull request على main.
#  ينتج:
#    ✅ Debug APK (قابل للتثبيت مباشرة)
#    ✅ نتائج الاختبارات (216 test)
#    ✅ تقرير البناء
#
#  لا يحتاج أي أسرار (Secrets) — يستخدم توقيع Debug.
# ═══════════════════════════════════════════════════════════════════

name: Android CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:   # تشغيل يدوي أيضاً

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Job 1: Build Debug APK + Run Tests
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.jvmargs=-Xmx2g

    steps:
      # ── 1. Checkout ──
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. JDK 17 ──
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Android SDK ──
      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install SDK components
        run: |
          # ثبّت كل ما يحتاجه المشروع
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            2>/dev/null || {
              # Fallback: إذا android-36 غير متاح، ثبّت أحدث إصدار متوفر
              echo "::warning::android-36 غير متاح — تجريب android-35"
              sdkmanager --install \
                "platforms;android-35" \
                "build-tools;35.0.0" \
                "platform-tools"
            }
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # ── 4. Gradle Wrapper (توليد الـ jar إذا كان مفقوداً) ──
      - name: 🔧 Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::notice::gradle-wrapper.jar مفقود — توليده..."
            # استخدم Gradle الرسمي لتوليد الـ wrapper
            GRADLE_VERSION=$(grep -oP 'gradle-\K[0-9.]+' gradle/wrapper/gradle-wrapper.properties || echo "8.11.1")
            echo "Gradle version: $GRADLE_VERSION"
            curl -sSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin --no-daemon
          fi
          # تأكد من وجود الملفات
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::فشل توليد gradle-wrapper.jar"; exit 1; }
          test -f gradlew && chmod +x gradlew
          echo "✅ Gradle Wrapper جاهز"

      # ── 5. Cache Gradle ──
      - name: 💾 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 6. Unit Tests ──
      - name: 🧪 Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest --stacktrace --build-cache 2>&1 | tee test-output.log
          TEST_EXIT=${PIPESTATUS[0]}
          if [ $TEST_EXIT -ne 0 ]; then
            echo "::error::❌ بعض الاختبارات فشلت! راجع السجل أعلاه."
            # اعرض ملخص الفشل
            grep -A 2 "FAILED\|failed\|AssertionError" test-output.log | head -30 || true
          fi
          exit $TEST_EXIT

      # ── 7. Build Debug APK ──
      - name: 🔨 Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --build-cache

      # ── 8. Upload test results ──
      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      # ── 9. Upload Debug APK ──
      - name: 📱 Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zimaster-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── 10. Build Summary ──
      - name: 📋 Build summary
        if: always()
        run: |
          {
            echo "## 🔨 نتائج البناء"
            echo ""
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
              echo "### ✅ Debug APK"
              echo "- **الحجم:** $SIZE"
              echo "- **الحزمة:** \`com.zmastery.english.debug\`"
              echo "- **التنزيل:** Artifacts ↓ → \`Zimaster-debug-apk\`"
            else
              echo "### ❌ فشل بناء Debug APK"
            fi
            echo ""
            if [ -d app/build/test-results/testDebugUnitTest ]; then
              PASSED=$(find app/build/test-results/testDebugUnitTest -name "*.xml" -exec grep -l 'failures="0"' {} \; 2>/dev/null | wc -l)
              TOTAL=$(find app/build/test-results/testDebugUnitTest -name "*.xml" 2>/dev/null | wc -l)
              echo "### 🧪 الاختبارات"
              echo "- ملفات النتائج: $TOTAL"
              echo "- ملفات بدون فشل: $PASSED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
