name: Android Release

# Zimaster · Kotlin 2.2.21 + Compose · AGP 8.10.1 · Gradle 8.11.1 · JDK 17
# compileSdk 36 · minSdk 24 · module: :app · applicationId: com.zmastery.english
# التوقيع: عبر GitHub Secrets إن وُجدت، وإلا مفتاح التصحيح (نسخة تجريبية).
# لا يوجد أي سر داخل هذا الملف.

on:
  workflow_dispatch:   # تشغيل يدوي من تبويب Actions
  # push:
  #   tags: ["v*"]     # اختياري: بناء تلقائي عند دفع وسم v*

permissions:
  contents: write   # إنشاء GitHub Release + رفع الملفات (APK/AAB) إليه

jobs:
  release:
    name: Build Release (APK + AAB)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 36 + build-tools 36.0.0)
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # gradle-wrapper.jar مفقود من المستودع: يُعاد توليده رسمياً هنا عند غيابه فقط
      - name: Restore Gradle Wrapper jar if missing
        run: |
          set -e
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::notice::gradle-wrapper.jar غير موجود — توليده من التوزيعة الرسمية Gradle 8.11.1"
            curl -sSL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle-dist.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing (from GitHub Secrets)
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] \
             && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::لا أسرار توقيع — توقيع تجريبي بمفتاح debug (قابل للتثبيت اليدوي)."
          fi

      - name: Build Release (assemble + bundle)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --build-cache

      - name: Report build failure clearly
        if: failure()
        run: |
          echo "::error::❌ فشل بناء Release — افتح سجل خطوة «Build Release» أعلاه؛ آخر رسالة خطأ من Gradle تحدد السبب الحقيقي. أصلح السبب وأعد التشغيل (لا تجاوزات)."

      - name: Collect artifacts
        if: success()
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -1)
          AAB_SRC=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          [ -n "$APK_SRC" ] && [ -n "$AAB_SRC" ] || { echo "::error::لم تُنتج Gradle ملفات APK/AAB"; exit 1; }
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then SUFFIX="signed"; else SUFFIX="debug-test"; fi
          mkdir -p dist
          cp "$APK_SRC" "dist/Zimaster-v${VERSION}-release-${SUFFIX}.apk"
          cp "$AAB_SRC" "dist/Zimaster-v${VERSION}-release-${SUFFIX}.aab"

      - name: Upload APK + AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zimaster-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

      # إنشاء إصدار GitHub حقيقي (يظهر في تبويب Releases) ورفع الملفات إليه.
      # الوسم فريد لكل تشغيل حتى لا يتعارض إصداران معاً عند إعادة التشغيل.
      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          RUN="${{ github.run_number }}"
          TAG="v${VERSION}-build.${RUN}"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            SUFFIX="signed"; SIGN="مفتاح Release 🔐"
          else
            SUFFIX="debug-test"; SIGN="مفتاح التصحيح (تجريبي) ⚠️"
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Zimaster v${VERSION} (build ${RUN})" \
            --notes "إصدار تلقائي من سير عمل Android Release.

- APK: Zimaster-v${VERSION}-release-${SUFFIX}.apk
- AAB: Zimaster-v${VERSION}-release-${SUFFIX}.aab
- التوقيع: ${SIGN}" \
            --latest

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ✅ نجح بناء Release لتطبيق Zimaster"
            echo "- الحزمة: \`com.zmastery.english\` · المهام: \`assembleRelease\` + \`bundleRelease\`"
            echo "- التوقيع: $( [ "${{ steps.signing.outputs.enabled }}" = "true" ] && echo "مفتاح Release 🔐" || echo "مفتاح التصحيح (تجريبي) ⚠️" )"
            echo "- **التنزيل:** قسم Artifacts أسفل الصفحة ← \`Zimaster-release\`"
          } >> "$GITHUB_STEP_SUMMARY"
