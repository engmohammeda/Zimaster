name: Android Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release (APK + AAB)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore Gradle Wrapper jar if missing
        run: |
          set -e
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle-dist.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
            else
              echo "Creating fallback google-services.json for CI..."
              cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "836170376747",
              "project_id": "zmastery",
              "storage_bucket": "zmastery.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:836170376747:android:9372331a395944a2792c6e",
                  "android_client_info": {
                    "package_name": "com.zmastery.english",
                    "certificate_hash": "14c9be6a96cbf9a00bbe3bdc38becd061afa0a64"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "836170376747-1ctsqum4pd34hf3bcvvvdkg42t7f6ni5.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAjukQ7B-rbb7XFiOguO0A14Z6Zkn7zAcM"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            fi
          fi
          test -f app/google-services.json

      - name: Prepare Signing Keystore
        id: signing
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using user-provided KEYSTORE_BASE64 from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystore/app.keystore"
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD || 'android' }}"
            ALIAS="${{ secrets.KEY_ALIAS || 'androiddebugkey' }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD || 'android' }}"
            
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/app.keystore"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASS"
              echo "RELEASE_KEY_ALIAS=$ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            
            # Also copy to root debug.keystore so fallback build steps use it
            cp "$RUNNER_TEMP/keystore/app.keystore" debug.keystore
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from repository embedded base64..."
            base64 -d debug.keystore.base64 > debug.keystore
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -f debug.keystore ]; then
            echo "Using existing repository debug.keystore..."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Generating standard deterministic debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          test -f debug.keystore || test -f "$RUNNER_TEMP/keystore/app.keystore"

      - name: Build Debug and Release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace --build-cache

      - name: Collect all build outputs
        if: success()
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "1.1.0")
          mkdir -p dist
          
          # Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/Zimaster-v${VERSION}-debug.apk"
          fi
          
          # Release APK
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$RELEASE_APK" ]; then
            if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then SUFFIX="signed"; else SUFFIX="unsigned"; fi
            cp "$RELEASE_APK" "dist/Zimaster-v${VERSION}-release-${SUFFIX}.apk"
          fi
          
          # Release AAB
          RELEASE_AAB=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
          if [ -n "$RELEASE_AAB" ]; then
            if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then SUFFIX="signed"; else SUFFIX="unsigned"; fi
            cp "$RELEASE_AAB" "dist/Zimaster-v${VERSION}-release-${SUFFIX}.aab"
          fi

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zimaster-APKs-and-Bundle
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "1.1.0")
          RUN="${{ github.run_number }}"
          TAG="v${VERSION}-build.${RUN}"
          
          cat << 'EOF' > release_notes.md
          ### 🚀 Zimaster Build Artifacts:
          - **Debug APK**: Ready to install directly on any device for testing.
          - **Release APK**: Optimized and minified release build.
          - **AAB Bundle**: Ready for publishing to Google Play Store.
          EOF
          
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Zimaster v${VERSION} (Build #${RUN})" \
            --notes-file release_notes.md \
            --latest

      - name: Job Summary
        if: success()
        run: |
          echo "## ✅ Zimaster Build Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- You can download Debug APK, Release APK, and AAB from Releases or Artifacts." >> "$GITHUB_STEP_SUMMARY"
