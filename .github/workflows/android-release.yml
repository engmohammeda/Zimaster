name: Android Build & Release

# ═══════════════════════════════════════════════════════════════════════════
# سير عمل إنتاجي متكامل — بلا لصقات هشة:
#   • google-services.json: سرّ (خام أو base64) إن وُجد، وإلا الملف المودع في app/.
#   • الأسرار الحقيقية فقط: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID / KEYSTORE_*.
#   • CI    — بناء + اختبارات إلزامية على أي فرع/PR (بلا نشر).
#   • Release — main/الوسوم/التشغيل اليدوي: اختبارات → semver → ملاحظات
#               مصنّفة → Release → تلجرام.
# ═══════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  # ─────────────────────────── CI: فحص سريع بلا نشر ───────────────────────────
  ci:
    name: CI · build + tests
    if: ${{ github.event_name == 'pull_request' || (!startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore Gradle Wrapper jar if missing
        run: |
          set -e
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle-dist.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: google-services.json (سرّ إن وُجد وإلا الملف المودع)
        env:
          GSC: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSC" ]; then
            # يقبل السرّ بصيغتين: JSON خام (يبدأ بـ {) أو base64 — بلا تحويل إجباري.
            case "$GSC" in
              '{'*) printf '%s' "$GSC" > app/google-services.json ;;
              *)    printf '%s' "$GSC" | base64 -d > app/google-services.json ;;
            esac
          elif [ -f app/google-services.json ]; then
            echo "لا سرّ مضبوط — استخدم app/google-services.json المودع (آمن: معرفات عامة فقط)"
          else
            echo "::error::لا سرّ GOOGLE_SERVICES_JSON ولا ملف مودع في app/"
            exit 1
          fi
          test -s app/google-services.json

      - name: Unit tests (بوابة الجودة)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace --build-cache

      - name: Build Debug (فحص ترجمة)
        run: ./gradlew :app:assembleDebug --stacktrace --build-cache

      - name: Upload CI APK
        uses: actions/upload-artifact@v4
        with:
          name: CI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ─────────────────────── Release: نشر كامل + تلجرام ───────────────────────
  release:
    name: Release · notes + semver + Telegram
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (كامل التاريخ والوسوم لأجل الملاحظات والترقيم)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore Gradle Wrapper jar if missing
        run: |
          set -e
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
            unzip -q /tmp/gradle-dist.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon
          fi
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: google-services.json (سرّ إن وُجد وإلا الملف المودع)
        env:
          GSC: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSC" ]; then
            # يقبل السرّ بصيغتين: JSON خام (يبدأ بـ {) أو base64 — بلا تحويل إجباري.
            case "$GSC" in
              '{'*) printf '%s' "$GSC" > app/google-services.json ;;
              *)    printf '%s' "$GSC" | base64 -d > app/google-services.json ;;
            esac
          elif [ -f app/google-services.json ]; then
            echo "لا سرّ مضبوط — استخدم app/google-services.json المودع (آمن: معرفات عامة فقط)"
          else
            echo "::error::لا سرّ GOOGLE_SERVICES_JSON ولا ملف مودع في app/"
            exit 1
          fi
          test -s app/google-services.json

      - name: Prepare Signing Keystore
        id: signing
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keystore/app.keystore"
            {
              echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/app.keystore"
              echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'android' }}"
              echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS || 'androiddebugkey' }}"
              echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'android' }}"
            } >> "$GITHUB_ENV"
            cp "$RUNNER_TEMP/keystore/app.keystore" debug.keystore
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ -f debug.keystore ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests (بوابة إلزامية قبل أي نشر)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace --build-cache

      - name: Compute semver + categorized changelog
        id: notes
        run: |
          set -euo pipefail
          # آخر وسم إصدار سابق (يقبل الصيغة الصارمة وصيغة البناءات)
          LAST=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-build\.[0-9]+)?$' | sort -V | tail -n1 || true)
          if [ -n "$LAST" ]; then
            BASE=$(echo "$LAST" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            RANGE="$LAST..HEAD"
          else
            BASE="1.1.0"
            RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          fi
          MA=$(echo "$BASE" | cut -d. -f1); MI=$(echo "$BASE" | cut -d. -f2); PA=$(echo "$BASE" | cut -d. -f3)
          SUBJ=$(git log --pretty=%s "$RANGE" || true)
          if echo "$SUBJ" | grep -q '^feat'; then
            MI=$((MI+1)); PA=0
          else
            PA=$((PA+1))
          fi
          VERSION="$MA.$MI.$PA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          bullets() { grep -E "$1" | sed -E "$2" | sed 's/^/- /' || true; }
          ADDED=$(echo "$SUBJ"   | bullets '^feat'        's/^feat[^:]*: *//' )
          FIXED=$(echo "$SUBJ"   | bullets '^fix'         's/^fix[^:]*: *//'  )
          CHANGED=$(echo "$SUBJ" | bullets '^(refactor|perf|style)' 's/^[a-z]+[^:]*: *//')
          INTERNAL=$(echo "$SUBJ"| bullets '^(ci|chore|build|docs)' 's/^[a-z]+[^:]*: *//')
          {
            echo "## ✨ أُضيف"
            [ -n "$ADDED" ]   && echo "$ADDED"   || echo "- لا إضافات مسجلة"
            echo
            echo "## 🐛 أُصلح"
            [ -n "$FIXED" ]   && echo "$FIXED"   || echo "- لا إصلاحات مسجلة"
            echo
            echo "## 🛠 تغيّر"
            [ -n "$CHANGED" ] && echo "$CHANGED" || echo "- لا تغييرات مسجلة"
            echo
            echo "## ⚙️ داخلي"
            [ -n "$INTERNAL" ]&& echo "$INTERNAL"|| echo "- صيانة دورية"
          } > /tmp/notes_body.md
          {
            echo ""
            echo "📦 يشمل: Debug APK + Release APK + AAB"
          } >> /tmp/notes_body.md
          echo "---- notes ----"; cat /tmp/notes_body.md

      - name: Stamp computed version into the build
        run: |
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${{ steps.notes.outputs.version }}\"/" app/build.gradle.kts
          grep -n "versionName" app/build.gradle.kts

      - name: Build Debug and Release
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace --build-cache

      - name: Collect outputs + SHA256
        id: collect
        run: |
          set -euo pipefail
          VERSION="${{ steps.notes.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Zimaster-v${VERSION}-debug.apk"
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          [ -n "$RELEASE_APK" ] && cp "$RELEASE_APK" "dist/Zimaster-v${VERSION}-release.apk"
          RELEASE_AAB=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
          [ -n "$RELEASE_AAB" ] && cp "$RELEASE_AAB" "dist/Zimaster-v${VERSION}-release.aab"
          {
            echo ""
            echo "## 🔐 بصمات SHA256"
            echo '```'
            (cd dist && sha256sum * )
            echo '```'
          } >> /tmp/notes_body.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zimaster-APKs-and-Bundle
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.collect.outputs.version }}"
          RUN="${{ github.run_number }}"
          TAG="v${VERSION}-build.${RUN}"
          {
            echo "# 🚀 Z-Mastery v${VERSION} (Build #${RUN})"
            echo ""
            cat /tmp/notes_body.md
          } > release_notes.md
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Z-Mastery v${VERSION} (Build #${RUN})" \
            --notes-file release_notes.md \
            --latest

      - name: Send to Telegram (اختياري — يتطلب السرّين)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::سرّا تلجرام غير مضبوطين — تم تخطي الإرسال"
            exit 0
          fi
          VERSION="${{ steps.collect.outputs.version }}"
          RUN="${{ github.run_number }}"
          API="https://api.telegram.org/bot${TG_TOKEN}"

          # الرسالة في ملف — بلا أسطر متعددة داخل YAML تجنباً لكسر المسافات البادئة
          {
            printf '%s\n' "🚀 Z-Mastery v${VERSION} (Build #${RUN}) — الجديد في هذا الإصدار:"
            printf '%s\n' ""
            cat /tmp/notes_body.md
          } > /tmp/telegram_message.txt

          # نطبع استجابة Telegram في السجل لتشخيص أي رفض (لا نكسر الإصدار)
          echo "--- sendMessage ---"
          curl -sS -X POST "${API}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text@/tmp/telegram_message.txt" || true
          echo

          for f in dist/*debug.apk dist/*release.apk dist/*release.aab; do
            if [ -f "$f" ]; then
              echo "--- sendDocument: $f ---"
              curl -sS -X POST "${API}/sendDocument" \
                -F "chat_id=${TG_CHAT}" \
                -F "document=@${f}" \
                -F "caption=🚀 Z-Mastery v${VERSION} (Build #${RUN})" || true
              echo
            fi
          done

      - name: Job Summary
        if: always()
        run: |
          echo "## ✅ Z-Mastery v${{ steps.collect.outputs.version || 'x' }} (Build #${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- الملاحظات المصنّفة + البصمات في نص الـ Release." >> "$GITHUB_STEP_SUMMARY"
          echo "- أُرسلت الملفات إلى تلجرام إن توفرت الأسرار." >> "$GITHUB_STEP_SUMMARY"
