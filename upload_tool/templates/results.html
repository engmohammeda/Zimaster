<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الرفع — Z-Mastery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 20px; text-align: center; }
        .result-item {
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .nav { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نتيجة الرفع</h1>

        {% for r in results %}
        <div class="result-item {{ 'success' if r.status == 'success' else 'error' }}">
            <div>
                <strong>{{ r.file }}</strong><br>
                <small>{{ r.msg }}</small>
            </div>
            <span>{{ "✅" if r.status == "success" else "❌" }}</span>
        </div>
        {% endfor %}

        <div class="nav">
            <a href="/" class="btn">رفع ملفات أخرى</a>
            <a href="/lessons" class="btn">قائمة الدروس</a>
        </div>
    </div>
</body>
</html>
