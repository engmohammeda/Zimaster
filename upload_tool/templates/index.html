<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Mastery — رافع الدروس</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .logo p {
            color: #666;
            font-size: 1.1rem;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .features {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .features h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .features ul {
            list-style: none;
            color: #666;
        }
        .features li {
            padding: 8px 0;
            padding-right: 25px;
            position: relative;
        }
        .features li::before {
            content: "✅";
            position: absolute;
            right: 0;
        }
        .nav-links {
            margin-top: 20px;
            text-align: center;
        }
        .nav-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
        .nav-links a:hover { text-decoration: underline; }
        .file-list {
            margin-top: 15px;
            text-align: right;
        }
        .file-item {
            background: #f8f9ff;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Z-Mastery</h1>
            <p>رافع الدروس والكورسات</p>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data" id="uploadForm">
            <label class="upload-area" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" name="lessons" accept=".json" multiple onchange="updateFileList(this)">
                <div class="upload-icon">📁</div>
                <h3>اضغط لاختيار الملفات</h3>
                <p>أو اسحب ملفات JSON هنا</p>
            </label>

            <div class="file-list" id="fileList"></div>

            <button type="submit" class="btn">رفع الدروس</button>
        </form>

        <div class="features">
            <h3>مميزات الأداة</h3>
            <ul>
                <li>رفع متعدد ملفات JSON دفعة واحدة</li>
                <li>التحقق التلقائي من صحة المصفوفة</li>
                <li>حفظ محلي مع ارشفة تلقائية</li>
                <li>API جاهز للرفع البرمجي</li>
            </ul>
        </div>

        <div class="nav-links">
            <a href="/lessons">📋 قائمة الدروس المرفوعة</a>
        </div>
    </div>

    <script>
        function updateFileList(input) {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            if (input.files.length > 0) {
                for (let file of input.files) {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerHTML = `<span>${file.name}</span><span>${(file.size/1024).toFixed(1)} KB</span>`;
                    list.appendChild(div);
                }
            }
        }

        // Drag and drop
        const uploadArea = document.querySelector('.upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#f0f0ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            const files = e.dataTransfer.files;
            document.getElementById('fileInput').files = files;
            updateFileList(document.getElementById('fileInput'));
        });
    </script>
</body>
</html>
