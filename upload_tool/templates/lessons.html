<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدروس المرفوعة — Z-Mastery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 20px; }
        .file-item {
            background: #f8f9ff;
            padding: 15px 20px;
            border-radius: 12px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-item:hover { background: #f0f0ff; }
        .file-name { font-weight: 600; color: #333; }
        .file-size { color: #666; font-size: 0.9rem; }
        .empty {
            text-align: center;
            color: #666;
            padding: 40px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .nav { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 الدروس المرفوعة</h1>

        {% if files %}
            {% for f in files %}
            <div class="file-item">
                <span class="file-name">{{ f.name }}</span>
                <span class="file-size">{{ f.size }}</span>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty">
                <p>لم يتم رفع أي دروس بعد</p>
            </div>
        {% endif %}

        <div class="nav">
            <a href="/" class="btn">الصفحة الرئيسية</a>
        </div>
    </div>
</body>
</html>
